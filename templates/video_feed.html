<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Video Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/video_styles.css') }}">
</head>
<body>
    <div class="container text-center mt-4">
        <h1>Real-Time Video Feed</h1> 
        <p>同時顯示二值化影像、原始影像，以及客戶端攝像頭的畫面。</p>

        <div class="video-container">
            <!-- 二值化影像 -->
            <div class="video-box">
                <h5>二值化影像</h5>
                <img src="/video_feed/binary" alt="Binary Video Feed">
            </div>

            <!-- 原始影像 -->
            <div class="video-box">
                <h5>原始影像</h5>
                <img src="/video_feed/original" alt="Original Video Feed">
            </div>
        </div>

        <a href="/" class="btn btn-primary">返回首頁</a>
    </div>

</body>
</html>
