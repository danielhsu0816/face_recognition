<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion and Face Recognition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=1.0"> <!-- 引入 CSS 文件 -->
</head>
<body>
    <div class="container text-center mt-5">
        <!-- 頁面標題 -->
        <div class="header">
            <h1 class="mb-3">Emotion and Face Recognition</h1>
            <p>請選擇功能：上傳圖片進行情感辨識，或使用攝像頭進行即時影像人臉與情緒偵測。</p>
        </div>
        
        <!-- 按鈕區 -->
        <div class="btn-container">
            <a href="/upload" class="btn btn-primary btn-lg">情緒辨識</a>
            <a href="/video_feed" class="btn btn-success btn-lg">即時影像辨識(在local端Demo時，選此按鈕)</a>
            <a href="/video_feed_from_client" class="btn btn-success btn-lg">即時影像辨識(當啟用Server時，選此按鈕))</a>
        </div>
    </div>
</body>
</html>
