<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=1.0"> <!-- 引入 CSS 文件 -->
</head>
<body>
    <header>
        <h1>預測結果</h1>
    </header>
    <main>
        <p>表情為：{{ emotion or '未知' }}，信心：{{ confidence or '未知' }}%</p>
        {% if filename %}
            <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="Uploaded Image" class="uploaded-image">
        {% else %}
            <p>沒有找到上傳的圖片。</p>
        {% endif %}
        <br>
        <a href="{{ url_for('upload.upload_file') }}" class="btn btn-secondary">返回上傳頁面</a>
    </main>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script> <!-- 引入 JavaScript 文件 -->
</body>
</html>
